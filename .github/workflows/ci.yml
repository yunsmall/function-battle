# 双平台构建 + 单元测试/自检；push v* tag 时自动 cpack 打 zip 并创建 GitHub Release
name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gen: -GNinja
            client: -DFG_BUILD_CLIENT=OFF    # Linux 无图形客户端（raylib 预编译包仅 Windows）
            cfg_dir: ""
            ext: ""
          - os: windows-latest
            gen: ""              # 不指定生成器：CMake 自动选最新 VS（写死版本会随 runner 镜像更新失配）
            client: ""
            cfg_dir: /RelWithDebInfo
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # 依赖走 vcpkg（与 README 一致）；缓存二进制包，避免每次从源码重编依赖
      - name: 缓存 vcpkg 二进制包
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: 安装依赖
        shell: bash
        run: '$VCPKG_INSTALLATION_ROOT/vcpkg install eigen3 nlohmann-json asio cxxopts exprtk gtest'

      - name: 配置
        shell: bash
        run: >
          cmake -B build ${{ matrix.gen }} ${{ matrix.client }}
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake

      - name: 构建
        run: cmake --build build --config RelWithDebInfo --parallel 4

      - name: 单元测试
        shell: bash
        run: ./build/src/tests${{ matrix.cfg_dir }}/fg_tests${{ matrix.ext }} --gtest_brief=1

      - name: 服务器自检
        shell: bash
        run: ./build/src/server${{ matrix.cfg_dir }}/fg_server${{ matrix.ext }} --selftest 10

      - name: 打包（tag 发布时）
        if: startsWith(github.ref, 'refs/tags/v')
        run: cd build && cpack -G ZIP -C RelWithDebInfo

      - name: 上传包（tag 发布时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ runner.os }}
          path: build/function_game-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.zip
          generate_release_notes: true
